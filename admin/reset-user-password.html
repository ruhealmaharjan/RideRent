<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Reset user password | RideRent</title>
        <link rel="icon" href="../assets/images/logo/mark.svg" />
        <link rel="stylesheet" href="../assets/css/style.css" />
        <link rel="stylesheet" href="../assets/css/admin.css?v=admin-reset-1" />
        <script src="../assets/js/admin.js?v=reset-page-2" defer></script>
    </head>
    <body data-admin-page="reset-password">
        <header class="admin-header">
            <a class="logo" href="../index.html">Ride<span>Rent</span></a>
            <nav class="actions admin-navigation" aria-label="Admin navigation">
                <a
                    class="button small secondary"
                    href="reset-user-password.html"
                    aria-current="page"
                    >Reset user password</a
                ><a class="button small secondary" href="messages.html">Rental desk messages</a
                ><button class="button small secondary" id="admin-logout" type="button" disabled>
                    Log out
                </button>
            </nav>
        </header>
        <main class="container">
            <div id="admin-alert" class="alert" role="alert" tabindex="-1" hidden></div>
            <p id="admin-loading" role="status">Checking administrator session…</p>
            <div id="dashboard-content" hidden>
                <div class="page-heading">
                    <h1>Reset user password</h1>
                    <p id="admin-welcome"></p>
                    <a class="button small secondary" href="dashboard.html">Back to dashboard</a>
                </div>
                <section class="section panel">
                    <h2>Help a customer reset their password</h2>
                    <p>
                        Verify the customer through your usual identity check before generating a
                        link. Share the link privately; it expires in 30 minutes.
                    </p>
                    <form id="customer-reset-form" class="form-grid narrow" method="post">
                        <label
                            >Customer email<input
                                id="reset-customer-email"
                                type="email"
                                maxlength="190"
                                autocomplete="off"
                                required /></label
                        ><label class="checkbox"
                            ><input id="reset-identity-verified" type="checkbox" required />I have
                            verified this customer's identity.</label
                        ><button class="button" type="submit">Generate reset link</button>
                    </form>
                    <div id="reset-link-result" hidden>
                        <p id="reset-link-description"></p>
                        <label
                            >Private reset link<input
                                id="customer-reset-link"
                                type="text"
                                readonly
                                autocomplete="off" /></label
                        ><button id="copy-reset-link" class="button small secondary" type="button">
                            Copy link
                        </button>
                        <p id="reset-copy-status" role="status"></p>
                    </div>
                </section>
            </div>
        </main>
    </body>
</html>
