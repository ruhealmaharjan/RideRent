<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta
            name="description"
            content="RideRent vehicle rental: browse vehicles, check dates, and manage your bookings."
        />
        <title>Change Password | RideRent</title>
        <link rel="icon" href="assets/images/logo/mark.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="assets/css/style.css" />
        <script type="module" src="assets/js/main.js"></script>
    </head>
    <body data-page="change-password">
        <a class="skip-link" href="#main">Skip to content</a>
        <header id="site-header"></header>
        <main id="main" class="container">
            <div id="alert" class="alert" role="status" tabindex="-1" hidden></div>
            <div class="page-heading">
                <span class="eyebrow">ACCOUNT SECURITY</span>
                <h1>Change your password.</h1>
            </div>
            <p id="password-rules">
                Use at least 8 characters, including one uppercase letter (A-Z), one number, and one
                special character such as !, @, or #.
            </p>
            <form method="post" id="page-form" class="panel narrow form-grid">
                <label
                    >Current password<span class="password-field"
                        ><input
                            type="password"
                            name="current_password"
                            id="current_password"
                            minlength="8"
                            maxlength="72"
                            autocomplete="current-password"
                            required
                        /><button
                            type="button"
                            class="password-toggle"
                            aria-label="Show current password"
                            data-password="current_password"
                        >
                            Show
                        </button></span
                    ></label
                ><label
                    >New password<span class="password-field"
                        ><input
                            type="password"
                            name="new_password"
                            id="new_password"
                            minlength="8"
                            maxlength="72"
                            autocomplete="new-password"
                            aria-describedby="password-rules"
                            pattern="(?=.*[A-Z])(?=.*[0-9])(?=.*[\p{P}\p{S}]).{8,}"
                            title="At least 8 characters, one uppercase letter, one number, and one special character."
                            required
                        /><button
                            type="button"
                            class="password-toggle"
                            aria-label="Show new password"
                            data-password="new_password"
                        >
                            Show
                        </button></span
                    ></label
                ><label
                    >Confirm new password<span class="password-field"
                        ><input
                            type="password"
                            name="confirm_password"
                            id="confirm_password"
                            minlength="8"
                            maxlength="72"
                            autocomplete="new-password"
                            aria-describedby="password-rules"
                            pattern="(?=.*[A-Z])(?=.*[0-9])(?=.*[\p{P}\p{S}]).{8,}"
                            title="At least 8 characters, one uppercase letter, one number, and one special character."
                            required
                        /><button
                            type="button"
                            class="password-toggle"
                            aria-label="Show confirm new password"
                            data-password="confirm_password"
                        >
                            Show
                        </button></span
                    ></label
                ><button class="button" type="submit">Update password</button>
            </form>
        </main>
        <footer id="site-footer"></footer>
        <noscript
            ><p class="panel">Enable JavaScript to load vehicles and use your account.</p></noscript
        >
    </body>
</html>
