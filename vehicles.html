<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta
            name="description"
            content="RideRent vehicle rental: browse vehicles, check dates, and manage your bookings."
        />
        <title>Our Vehicles | RideRent</title>
        <link rel="icon" href="assets/images/logo/mark.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="assets/css/style.css" />
        <script type="module" src="assets/js/main.js"></script>
    </head>
    <body data-page="vehicles">
        <a class="skip-link" href="#main">Skip to content</a>
        <header id="site-header"></header>
        <main id="main" class="container">
            <div id="alert" class="alert" role="status" tabindex="-1" hidden></div>
            <div class="fleet-buttons" role="group" aria-label="Filter vehicles by type">
                <button
                    type="button"
                    class="button small secondary"
                    data-fleet="all"
                    aria-pressed="false"
                >
                    All vehicles</button
                ><button
                    type="button"
                    class="button small secondary"
                    data-fleet="Cars"
                    aria-pressed="false"
                >
                    Cars</button
                ><button
                    type="button"
                    class="button small secondary"
                    data-fleet="Bikes"
                    aria-pressed="false"
                >
                    Bikes</button
                ><button
                    type="button"
                    class="button small secondary"
                    data-fleet="Scooters"
                    aria-pressed="false"
                >
                    Scooters</button
                ><button
                    type="button"
                    class="button small secondary"
                    data-fleet="SUVs"
                    aria-pressed="false"
                >
                    Jeeps / SUVs</button
                ><button
                    type="button"
                    class="button small secondary"
                    data-fleet="Vans"
                    aria-pressed="false"
                >
                    Vans</button
                ><button
                    type="button"
                    class="button small secondary"
                    data-fleet="ev"
                    aria-pressed="false"
                >
                    EVs
                </button>
            </div>
            <div class="catalog-layout">
                <aside class="filter-panel">
                    <form id="filter-form">
                        <label
                            >Search vehicles<input
                                type="search"
                                name="q"
                                id="q"
                                value=""
                                placeholder="Name, brand or model"
                                maxlength="100" /></label
                        ><select
                            hidden
                            aria-hidden="true"
                            tabindex="-1"
                            name="category"
                            id="category"
                        >
                            <option value="">All categories</option>
                            <option value="1">Cars</option>
                            <option value="2">SUVs</option>
                            <option value="3">Bikes</option>
                            <option value="4">Scooters</option>
                            <option value="5">Vans</option></select
                        ><label
                            >Brand<select name="brand" id="brand">
                                <option value="">All brands</option>
                            </select></label
                        ><label
                            >Fuel<select name="fuel" id="fuel">
                                <option value="">Any fuel</option>
                                <option value="Petrol">Petrol</option>
                                <option value="Diesel">Diesel</option>
                                <option value="Electric">Electric</option>
                                <option value="Hybrid">Hybrid</option>
                            </select></label
                        ><label
                            >Transmission<select name="transmission" id="transmission">
                                <option value="">Any transmission</option>
                                <option value="Manual">Manual</option>
                                <option value="Automatic">Automatic</option>
                            </select></label
                        ><label
                            >Sort by<select name="sort" id="sort">
                                <option value="newest">Newest first</option>
                                <option value="name_asc">Name: A–Z</option>
                                <option value="price_asc">Price: low to high</option>
                                <option value="price_desc">Price: high to low</option>
                            </select></label
                        ><button class="button" type="submit">Apply filters</button
                        ><a class="text-link" href="vehicles.html">Reset filters</a>
                    </form>
                </aside>
                <section>
                    <p id="result-count" class="muted" aria-live="polite">Loading vehicles…</p>
                    <div id="vehicle-grid" class="vehicle-grid catalogue"></div>
                    <nav id="pagination" class="pagination" aria-label="Vehicle result pages"></nav>
                </section>
            </div>
        </main>
        <footer id="site-footer"></footer>
        <noscript
            ><p class="panel">Enable JavaScript to load vehicles and use your account.</p></noscript
        >
    </body>
</html>
