<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta
            name="description"
            content="RideRent vehicle rental: browse vehicles, check dates, and manage your bookings."
        />
        <title>Edit Profile | RideRent</title>
        <link rel="icon" href="assets/images/logo/mark.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="assets/css/style.css" />
        <script type="module" src="assets/js/main.js"></script>
    </head>
    <body data-page="edit-profile">
        <a class="skip-link" href="#main">Skip to content</a>
        <header id="site-header"></header>
        <main id="main" class="container">
            <div id="alert" class="alert" role="status" tabindex="-1" hidden></div>
            <div class="page-heading">
                <span class="eyebrow">YOUR ACCOUNT</span>
                <h1>Edit your profile.</h1>
            </div>
            <form method="post" id="page-form" class="panel form-grid two">
                <label
                    >Full name<input
                        type="text"
                        name="full_name"
                        id="full_name"
                        value=""
                        autocomplete="name"
                        maxlength="100"
                        required /></label
                ><label
                    >Phone<input
                        type="tel"
                        name="phone"
                        id="phone"
                        value=""
                        autocomplete="tel"
                        minlength="7"
                        maxlength="30"
                        pattern="[+0-9 ()\-]{7,30}"
                        required /></label
                ><label
                    >Address<textarea
                        name="address"
                        id="address"
                        rows="3"
                        maxlength="500"
                        required
                    ></textarea></label
                ><label
                    >Driving licence number<input
                        type="text"
                        name="driving_license"
                        id="driving_license"
                        value=""
                        maxlength="80"
                        required
                /></label>
                <div class="full">
                    <button class="button" type="submit">Save changes</button>
                    <a class="text-link" href="profile.html">Back to profile</a>
                </div>
            </form>
        </main>
        <footer id="site-footer"></footer>
        <noscript
            ><p class="panel">Enable JavaScript to load vehicles and use your account.</p></noscript
        >
    </body>
</html>
