<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta
            name="description"
            content="RideRent vehicle rental: browse vehicles, check dates, and manage your bookings."
        />
        <title>Log In | RideRent</title>
        <link rel="icon" href="assets/images/logo/mark.svg" type="image/svg+xml" />
        <link rel="stylesheet" href="assets/css/style.css?v=login-box-3" />
        <script type="module" src="assets/js/main.js"></script>
    </head>
    <body data-page="login">
        <a class="skip-link" href="#main">Skip to content</a>
        <header id="site-header"></header>
        <main id="main" class="container">
            <div id="alert" class="alert" role="status" tabindex="-1" hidden></div>
            <section class="auth-layout">
                <aside class="auth-aside">
                    <a class="logo" href="index.html">Ride<span>Rent</span></a>
                    <h2>A good journey<br />starts here.</h2>
                    <p>Your next ride, a few simple steps away.</p>
                    <div class="road-mark"></div>
                    <span>CHOOSE YOUR RIDE. MAKE IT YOURS.</span>
                </aside>
                <div class="form-panel">
                    <div class="page-heading">
                        <span class="eyebrow">WELCOME BACK</span>
                        <h1>Let’s get you moving.</h1>
                    </div>
                    <form method="post" id="page-form" class="form-grid">
                        <label
                            >Email<input
                                type="email"
                                name="email"
                                id="email"
                                value=""
                                autocomplete="email"
                                maxlength="190"
                                required /></label
                        ><label
                            >Password<input
                                type="password"
                                name="password"
                                id="password"
                                value=""
                                autocomplete="current-password"
                                maxlength="72"
                                required /></label
                        ><label class="checkbox"
                            ><input type="checkbox" name="remember" />Remember me for 30 days</label
                        >
                        <div class="full"><button class="button" type="submit">Log in</button></div>
                    </form>
                    <p class="form-foot"><a href="forgot-password.html">Forgot password?</a></p>
                    <p class="form-foot">
                        New to RideRent? <a href="register.html">Create an account</a>
                    </p>
                </div>
            </section>
        </main>
        <footer id="site-footer"></footer>
        <noscript
            ><p class="panel">Enable JavaScript to load vehicles and use your account.</p></noscript
        >
    </body>
</html>
